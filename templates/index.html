<!DOCTYPE html>
<title>{{ config.title }}</title>
<link rel=stylesheet type=text/css href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<link rel="stylesheet" href="/resources/demos/style.css">  <!-- TODO: update?! -->
<script src="{{ url_for('static', filename='jquery.js') }}"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script src="{{ url_for('static', filename='dropzone.js') }}"></script>
<script type="text/javascript">
$(document).ready(function() {
    function generateBingo() {
        var values = $("#bingovalues").val().split("\n");
        postValues(values);
        dialog.dialog("close");
    }

    var form;

    var dialog = $("#dialog-form").dialog({
        autoOpen: false,
        height: 400,
        width: 800,
        modal: true,
        buttons: {
            "Bingofeld generieren": generateBingo,
            "Schließen": function() {
                $(this).dialog("close");
            }
        },
        close: function() {
            form[0].reset();
        }
    });

    form = dialog.find("form").on("submit", function(event) {
        event.preventDefault();
        generateBingo();
    });

    $("#add").button().on("click", function() {
        dialog.dialog("open");
    });

    $("#shuffle").button().on("click", function() {
        postValues(getCurrentTableData());
    });

    // allow dropping text files onto the web page
    var myDropzone = new Dropzone("body", {
        url: "/file-upload",
        clickable: false,  // clicking empty page areas must not open a file dialog
        parallelUploads: 1,  // several dropped files: the last one wins, deterministically
        acceptedFiles: ".txt,.csv",
        maxFilesize: 16,  // MB, same limit as the server
        dictInvalidFileType: "Nur .txt- und .csv-Dateien sind erlaubt.",
        dictFileTooBig: "Die Datei ist zu groß (maximal 16 MB)."
    });
    myDropzone.on("success", function(file, response) {
        showError("");
        refreshTable(response);
    });
    // previews are hidden, so don't keep finished files around
    myDropzone.on("complete", function(file) {
        myDropzone.removeFile(file);
    });
    // keep the current table and tell the user why the file was refused
    myDropzone.on("error", function(file, message) {
        showError(message.error || message);
    });
});
</script>
<div id="dialog-form" title="Erstelle ein neues Bingofeld">
  <form>
    <fieldset>
      <label for="bingovalues">Werte für die Bingofelder (jede Zeile entspricht einem Eintrag)</label>
      <textarea rows=10 cols=80 name=bingovalues id=bingovalues class="text ui-widget-content ui-corner-all"></textarea>
      <!-- Allow form submission with keyboard without duplicating the dialog button -->
      <input type="submit" tabindex="-1" style="position:absolute; top:-1000px">
    </fieldset>
  </form>
</div>

<div id=main>
  <h1>{{ config.title }}</h1>
  <button id=add>Bingowerte eintragen</button>
  <button id=shuffle>Eingetragene Werte durchmischen</button>
  <p id=error role=alert></p>
</div>
